<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samriddho Computer Education - Professional Tech Training Institute">
  <title>Student Details - Samriddho Computer Education</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon.jpeg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand"><img src="/favicon.ico" alt="Logo" class="logo-small"> Samriddho Computer Education</div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/courses">Courses</a></li>
        <li><a href="/student-projects">Projects</a></li>
        <li><a href="/downloads">Downloads</a></li>
        <li><a href="/student-details" class="active">Portal</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Student Information Portal</h1>
      <p>Find Your Student Details Using Enrollment ID</p>
    </div>
  </section>

  <section class="search-section">
    <div class="container">
      <form id="studentSearch">
        <input type="text" id="enrollmentId" placeholder="Enter Enrollment ID" required>
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <div id="studentResult"></div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <img src="/icon.jpeg" alt="Logo" class="footer-logo">
          <p>&copy; 2025 Samriddho Computer Education</p>
        </div>
        <div class="footer-section"><p>Building tomorrow's tech leaders today.</p></div>
      </div>
    </div>
  </footer>
  <script src="/js/script.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) return;

    const input = document.getElementById("enrollmentId");
    const form = document.getElementById("studentSearch");

    if (!input || !form) return;

    input.value = id;

    form.dispatchEvent(
        new SubmitEvent("submit", {
            bubbles: true,
            cancelable: true
        })
    );
});
</script>
</body>
</html>
