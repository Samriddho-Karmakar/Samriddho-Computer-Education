<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Access - Samriddho Computer Education</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0066ff,#00d9ff);padding:2rem}
    .login-box{background:#fff;padding:3rem;border-radius:12px;box-shadow:0 8px 32px rgba(0,102,255,.2);width:100%;max-width:400px}
    .login-header{text-align:center;margin-bottom:2rem}
    .login-icon{width:60px;height:60px;margin:0 auto 1rem;background:linear-gradient(135deg,#0066ff,#00d9ff);border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center}
    .login-icon img{width:100%;height:100%;object-fit:contain}
    .login-header h1{color:#0066ff;font-size:1.8rem;margin-bottom:.5rem}
    .login-header p{color:#666;font-size:.95rem}
  </style>
  <meta name="robots" content="noindex,nofollow">
</head>
<body style="margin:0;padding:0;">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="login-icon"><img src="/favicon.ico" alt="Teacher"></div>
        <h1>Teacher Access</h1>
        <p>Samriddho Computer Education</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Access Secret:</label>
          <input type="password" name="secret" required placeholder="Enter access secret">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Access Teacher Panel</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const secret = document.querySelector('input[name="secret"]').value;
      try {
        const response = await fetch('/api/teacher-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret }),
        });
        const data = await response.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          alert(data.message || 'Invalid secret');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
